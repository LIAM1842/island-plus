name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: |
          set +e
          ./gradlew --no-daemon assembleRelease > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E '^e: |error:|What went wrong|Execution failed|Unresolved|Could not|^> ' build.log | head -60 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failed::${msg}"
          fi
          exit $code

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DynamicIsland-Plus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-Plus-apk
          path: out/DynamicIsland-Plus.apk
          retention-days: 30

      # A Release page is easiest to open from a phone: download the APK straight from it
      - name: Publish release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/DynamicIsland-Plus.apk \
            --title "Dynamic Island Plus $tag" \
            --notes "Signed APK. Install over a previous Plus build; if the original app is installed, uninstall it first (different signing key)." \
            --target "$GITHUB_SHA" --latest
